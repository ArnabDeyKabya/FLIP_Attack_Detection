# Stage 2 of 3 - dog(5) -> cat(3) attack pipeline.
#
# Reads the expert trajectory from stage 1 and optimises soft labels that steer
# a victim's training toward the backdoored expert. This is the expensive stage
# and the one most likely to be interrupted, which is why stage 1 is separate.
#
# Outputs: experiments/dogcat_attack/{labels,true,losses}.npy
# Done when labels.npy and true.npy exist.
#
# Run (normally via run_dogcat_gate.py):
#   python run_experiment.py dogcat_2_labels

[generate_labels]
input_pths   = "out/checkpoints/r32p_1xs_dogcat/{}/model_{}_{}.pth"
opt_pths     = "out/checkpoints/r32p_1xs_dogcat/{}/model_{}_{}_opt.pth"
expert_model = "r32p"
trainer      = "sgd"
dataset      = "cifar"
source_label = 5
target_label = 3
poisoner     = "1xs"
output_dir   = "experiments/dogcat_attack/"
lambda       = 0.0

[generate_labels.expert_config]
experts = 1
min     = 0
max     = 20

[generate_labels.attack_config]
iterations   = 5
one_hot_temp = 5
alpha        = 0
label_kwargs = {lr = 150, momentum = 0.5}
