# Defended: train_user_defense in 'remove' mode with auto-threshold removal.
# Drops samples with k-NN disagreement > 0.5 before training the user model.
#
# Expected summary.json (rough — actual numbers depend on FLIP labels):
#   { "mode": "remove", "score_key": "ssl_knn_k20", "cta": ~0.90, "pta": <0.50 }
#
# Compare against knn_defense_cifar_1xs_1500_none for the headline defense win.
#
# Run:
#   python run_experiment.py knn_defense_cifar_1xs_1500_remove

[train_user_defense]
input_labels = "precomputed_labels/cifar/r32p/1xs/1500.npy"
true_labels  = "precomputed_labels/cifar/r32p/1xs/true.npy"
output_dir   = "experiments/knn_defense_cifar_1xs_1500_remove/"
user_model   = "r32p"
trainer      = "sgd"
dataset      = "cifar"
source_label = 9
target_label = 4
poisoner     = "1xs"
defense_mode = "remove"
soft         = false
alpha        = 0.0
seed         = 0

[train_user_defense.knn]
encoder       = "dinov2_vits14"
k             = 20
scoring       = "disagreement"
removal_count = "auto"
threshold     = 0.5
batch_size    = 256
feature_cache = "data/ssl_features"
