# Defense-aware FLIP against the DINOv2 k-NN audit.
#
# Re-runs FLIP's flip selection with full knowledge of the defense: a candidate
# is admissible only if the defender's k-NN disagreement score for its flipped
# label is <= tau. The expert trajectories are NOT retrained — this reuses the
# labels.npy already produced by experiments/example_attack, so the whole sweep
# costs one k-NN graph build (~seconds on cached features).
#
# tau = 1.0 is unconstrained and must reproduce experiments/example_attack/1500.npy
# exactly; manifest.json records this as "reproduces_baseline": true.
#
# The attacker's k must match the defense being evaded (k=20, the operating
# point used in knn_defense_cifar_1xs_1500_remove).
#
# Run:
#   python run_experiment.py adaptive_flip_cifar_1xs
#
# Then train victims on each tau with:
#   python scripts/adaptive/run_adaptive_sweep.py

[select_flips_adaptive]
input_label_glob = "experiments/example_attack/labels.npy"
true_labels      = "experiments/example_attack/true.npy"
output_dir       = "experiments/adaptive_flip_cifar_1xs/"
dataset          = "cifar"
source_label     = 9
budgets          = [1500]
taus             = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1]
refine_iters     = 3

[select_flips_adaptive.knn]
encoder       = "dinov2_vits14"
k             = 20
scoring       = "disagreement"
batch_size    = 256
feature_cache = "data/ssl_features"
