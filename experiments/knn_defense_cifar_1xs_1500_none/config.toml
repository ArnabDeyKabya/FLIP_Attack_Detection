# Baseline: train_user_defense in 'none' mode — regression-equivalent to vanilla
# train_user on the same FLIP labels. Detection scores are still computed and
# logged so this run emits the same metric schema as the defended run.
#
# Expected summary.json (rough):
#   { "mode": "none", "score_key": "ssl_knn_k20", "cta": ~0.91, "pta": ~0.99 }
#
# Run:
#   python run_experiment.py knn_defense_cifar_1xs_1500_none

[train_user_defense]
input_labels = "precomputed_labels/cifar/r32p/1xs/1500.npy"
true_labels  = "precomputed_labels/cifar/r32p/1xs/true.npy"
output_dir   = "experiments/knn_defense_cifar_1xs_1500_none/"
user_model   = "r32p"
trainer      = "sgd"
dataset      = "cifar"
source_label = 9
target_label = 4
poisoner     = "1xs"
defense_mode = "none"
soft         = false
alpha        = 0.0
seed         = 0

[train_user_defense.knn]
encoder       = "dinov2_vits14"
k             = 20
scoring       = "disagreement"
removal_count = "auto"
threshold     = 0.5
batch_size    = 256
feature_cache = "data/ssl_features"
